# Shortly API + PostgreSQL.
#
# This file contains no development-only settings: on its own it runs the API as Production.
#   Local development:  docker compose up --build        (docker-compose.override.yml is merged automatically)
#   Production-like:    docker compose -f docker-compose.yml up --build
#
# Required values come from .env (see .env.template). Nothing here requires Redis or any other extra service.
services:
  shortly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortly-api
    restart: on-failure
    ports:
      - "${API_PORT:-5001}:8080"
    environment:
      ConnectionStrings__Database: "Host=shortly-db;Port=5432;Database=shortly;Username=postgres;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      Jwt__Key: ${JWT__KEY:?Set JWT__KEY in .env}
      Jwt__Issuer: ${JWT__ISSUER:?Set JWT__ISSUER in .env}
      Jwt__Audience: ${JWT__AUDIENCE:?Set JWT__AUDIENCE in .env}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      EmailSettings__Smtp__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Smtp__Password: ${EMAIL_PASSWORD:-}
    depends_on:
      shortly-db:
        condition: service_healthy
    networks:
      - shortly-network

  shortly-db:
    image: postgres:18
    container_name: shortly-db
    restart: on-failure
    environment:
      POSTGRES_DB: shortly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - shortly-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shortly-network

networks:
  shortly-network:
    driver: bridge

volumes:
  shortly-db-data:
